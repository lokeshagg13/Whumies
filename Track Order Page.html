<section class="whumies-track-order-section">
  <div class="whumies-track-order-wrapper">
    <div class="whumies-track-order-flip-card" id="whumiesTrackOrderFlipCard">
      <div class="whumies-track-order-flip-inner">
        <!-- FRONT: FORM SIDE -->
        <div class="whumies-track-order-face whumies-track-order-face-front">
          <div class="whumies-track-order-card">
            <p class="whumies-track-order-eyebrow">Whumies Order Support</p>
            <h1 class="whumies-track-order-title">Track Your Order</h1>
            <p class="whumies-track-order-subtitle">
              Enter your order number and either your mobile number or email
              address to get your order details.
            </p>

            <form
              id="whumiesTrackOrderForm"
              class="whumies-track-order-form"
              novalidate
            >
              <div class="whumies-form-group">
                <label for="whumiesOrderNumber">Order Number</label>
                <div class="whumies-order-input-wrap">
                  <span class="whumies-order-prefix">#wh</span>
                  <input
                    type="text"
                    id="whumiesOrderNumber"
                    name="order_number"
                    class="whumies-order-input"
                    inputmode="numeric"
                    autocomplete="off"
                    maxlength="10"
                    required
                  />
                </div>
              </div>

              <div class="whumies-form-group">
                <label>Search Using</label>
                <div class="whumies-search-mode-switch">
                  <button
                    type="button"
                    class="whumies-mode-btn is-active"
                    data-mode="mobile"
                  >
                    Mobile Number
                  </button>
                  <button
                    type="button"
                    class="whumies-mode-btn"
                    data-mode="email"
                  >
                    Email Address
                  </button>
                </div>
              </div>

              <div
                class="whumies-form-group"
                id="whumiesMobileGroup"
                style="display: flex"
              >
                <label for="whumiesMobileNumber">Mobile Number</label>
                <input
                  type="tel"
                  id="whumiesMobileNumber"
                  name="mobile_number"
                  placeholder="Enter your mobile number"
                  inputmode="numeric"
                  autocomplete="tel"
                  maxlength="15"
                />
              </div>

              <div
                class="whumies-form-group whumies-hidden"
                id="whumiesEmailGroup"
                style="display: none"
              >
                <label for="whumiesEmailAddress">Email Address</label>
                <input
                  type="email"
                  id="whumiesEmailAddress"
                  name="email"
                  placeholder="Enter your email address"
                  autocomplete="email"
                  maxlength="120"
                />
              </div>

              <button
                type="submit"
                class="whumies-track-order-btn"
                id="whumiesSubmitBtn"
              >
                <span class="whumies-btn-text">Get Details</span>
                <span class="whumies-btn-loader" aria-hidden="true"></span>
              </button>
            </form>

            <div
              id="whumiesTrackOrderMessage"
              class="whumies-track-order-message"
            ></div>
          </div>
        </div>

        <!-- BACK: DETAILS SIDE -->
        <div class="whumies-track-order-face whumies-track-order-face-back">
          <div class="whumies-track-order-card whumies-track-order-card-back">
            <div
              id="whumiesOrderDetailsMount"
              class="whumies-order-details-mount"
            ></div>

            <div class="whumies-order-details-actions">
              <button
                type="button"
                id="whumiesSearchAgainBtn"
                class="whumies-secondary-btn"
              >
                Search Another Order
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const form = document.getElementById("whumiesTrackOrderForm");
    const orderInput = document.getElementById("whumiesOrderNumber");
    const mobileInput = document.getElementById("whumiesMobileNumber");
    const emailInput = document.getElementById("whumiesEmailAddress");
    const mobileGroup = document.getElementById("whumiesMobileGroup");
    const emailGroup = document.getElementById("whumiesEmailGroup");
    const modeButtons = document.querySelectorAll(".whumies-mode-btn");
    const messageBox = document.getElementById("whumiesTrackOrderMessage");
    const submitBtn = document.getElementById("whumiesSubmitBtn");
    const submitBtnText = submitBtn.querySelector(".whumies-btn-text");
    const flipCard = document.getElementById("whumiesTrackOrderFlipCard");
    const detailsMount = document.getElementById("whumiesOrderDetailsMount");
    const searchAgainBtn = document.getElementById("whumiesSearchAgainBtn");

    const ORDER_MIN_LENGTH = 4;
    const ORDER_MAX_LENGTH = 10;
    const MOBILE_MIN_LENGTH = 6;
    const MOBILE_MAX_LENGTH = 15;

    let activeMode = "mobile";
    let isSubmitting = false;

    function sanitizeText(value) {
      return String(value || "")
        .replace(/[<>"'`;(){}[\]\\]/g, "")
        .trim();
    }

    function digitsOnly(value) {
      return value.replace(/\D/g, "");
    }

    function isValidEmail(value) {
      const email = sanitizeText(value).toLowerCase();
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    function escapeHTML(value) {
      return String(value ?? "-")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function clearErrors() {
      orderInput.classList.remove("whumies-input-error");
      mobileInput.classList.remove("whumies-input-error");
      emailInput.classList.remove("whumies-input-error");
      messageBox.innerHTML = "";
    }

    function showError(message, field) {
      messageBox.innerHTML = `<div class="whumies-error-box">${escapeHTML(message)}</div>`;

      if (field === "order") {
        orderInput.classList.add("whumies-input-error");
        orderInput.focus();
      }

      if (field === "mobile") {
        mobileInput.classList.add("whumies-input-error");
        mobileInput.focus();
      }

      if (field === "email") {
        emailInput.classList.add("whumies-input-error");
        emailInput.focus();
      }
    }

    function setLoadingState(isLoading) {
      isSubmitting = isLoading;
      submitBtn.disabled = isLoading;
      submitBtn.classList.toggle("is-loading", isLoading);
      submitBtnText.textContent = isLoading
        ? "Fetching Details..."
        : "Get Details";
    }

    function flipToDetails() {
      flipCard.classList.add("is-flipped");
      setTimeout(function () {
        const scrollArea = detailsMount.querySelector(
          ".whumies-order-scroll-area",
        );
        if (scrollArea) scrollArea.scrollTop = 0;

        const indicator = document.getElementById("whumiesScrollIndicator");
        if (scrollArea && indicator) {
          const hasOverflow =
            scrollArea.scrollHeight > scrollArea.clientHeight + 4;
          indicator.classList.toggle("is-visible", hasOverflow);
        }
      }, 250);
    }

    function flipToForm() {
      flipCard.classList.remove("is-flipped");
      clearErrors();
      setTimeout(function () {
        form.scrollIntoView({ behavior: "smooth", block: "start" });
      }, 250);
    }

    function setMode(mode) {
      activeMode = mode;

      modeButtons.forEach((btn) => {
        const isActive = btn.dataset.mode === mode;
        btn.classList.toggle("is-active", isActive);
        btn.setAttribute("aria-pressed", String(isActive));
      });

      if (mode === "mobile") {
        mobileGroup.classList.remove("whumies-hidden");
        mobileGroup.style.display = "flex";

        emailGroup.classList.add("whumies-hidden");
        emailGroup.style.display = "none";

        emailInput.value = "";
        emailInput.classList.remove("whumies-input-error");
      } else {
        emailGroup.classList.remove("whumies-hidden");
        emailGroup.style.display = "flex";

        mobileGroup.classList.add("whumies-hidden");
        mobileGroup.style.display = "none";

        mobileInput.value = "";
        mobileInput.classList.remove("whumies-input-error");
      }
    }

    function formatMoney(money) {
      if (!money || !money.amount) return "-";
      const amount = Number(money.amount);
      const currency = money.currencyCode || "INR";

      try {
        return new Intl.NumberFormat("en-IN", {
          style: "currency",
          currency,
          maximumFractionDigits: 2,
        }).format(amount);
      } catch (e) {
        return `₹${amount.toFixed(2)}`;
      }
    }

    function formatAddress(address) {
      if (!address) return "-";

      if (Array.isArray(address.formatted) && address.formatted.length) {
        const nameLine = address.name ? [escapeHTML(address.name)] : [];
        return [...nameLine, ...address.formatted.map(escapeHTML)].join(", ");
      }

      const parts = [
        address.name,
        address.address1,
        address.address2,
        address.city,
        address.province,
        address.zip,
        address.country,
      ]
        .filter(Boolean)
        .map(escapeHTML);

      return parts.length ? parts.join(", ") : "-";
    }

    function setupScrollIndicator() {
      const scrollArea = document.getElementById("whumiesOrderScrollArea");
      const indicator = document.getElementById("whumiesScrollIndicator");

      if (!scrollArea || !indicator) return;

      function updateIndicator() {
        const hasOverflow =
          scrollArea.scrollHeight > scrollArea.clientHeight + 4;
        const isNearBottom =
          scrollArea.scrollTop + scrollArea.clientHeight >=
          scrollArea.scrollHeight - 8;

        indicator.classList.toggle("is-visible", hasOverflow && !isNearBottom);
      }

      scrollArea.addEventListener("scroll", updateIndicator);
      window.addEventListener("resize", updateIndicator);

      requestAnimationFrame(updateIndicator);
    }

    function renderOrderDetails(order) {
      const productsHTML = (order.products || []).length
        ? `
          <ul class="whumies-order-products-list">
            ${order.products
              .map((product) => {
                const productName = escapeHTML(product.name || "Product");
                const variant = product.variant
                  ? `, ${escapeHTML(product.variant)}`
                  : "";
                const quantity = Number(product.quantity || 0);
                const unitPrice = formatMoney(product.unitPrice);
                const lineTotal = formatMoney(product.lineTotal);

                return `
                  <li class="whumies-order-product-item">
                    <span class="whumies-order-product-name">${productName}${variant}</span>
                    <span class="whumies-order-product-meta">– Quantity: ${quantity}</span>
                    <div class="whumies-order-product-price">
                      – Price: ${lineTotal}
                      ${
                        quantity > 1
                          ? `<span class="whumies-order-product-unit">(Unit Price: ${unitPrice})</span>`
                          : ""
                      }
                    </div>
                  </li>
                `;
              })
              .join("")}
          </ul>
        `
        : `<p class="whumies-order-empty">No product details available.</p>`;

      const trackingHTML = (order.tracking || []).length
        ? `
          <div class="whumies-tracking-list">
            ${(order.tracking || [])
              .map((track) => {
                const company = escapeHTML(track.company || "Courier");
                const trackingNumber = escapeHTML(track.trackingNumber || "-");
                const trackingUrl = track.trackingUrl
                  ? `
                    <div class="whumies-tracking-url-row">
                      <span class="whumies-detail-label">Tracking URL:</span>
                      <a
                        href="${escapeHTML(track.trackingUrl)}"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="whumies-tracking-url-text"
                      >
                        ${escapeHTML(track.trackingUrl)}
                      </a>
                    </div>
                  `
                  : "";

                return `
                  <div class="whumies-tracking-item">
                    <div class="whumies-detail-row">
                      <span class="whumies-detail-label">Courier:</span>
                      <span class="whumies-detail-value">${company}</span>
                    </div>
                    <div class="whumies-detail-row">
                      <span class="whumies-detail-label">Tracking Number:</span>
                      <span class="whumies-detail-value">${trackingNumber}</span>
                    </div>
                    ${trackingUrl}
                  </div>
                `;
              })
              .join("")}
          </div>
        `
        : `
          <div class="whumies-tracking-note">
            Tracking not available yet.
          </div>
        `;

      detailsMount.innerHTML = `
        <div class="whumies-order-details-card">
          <div class="whumies-order-details-layout">
            <div class="whumies-order-scroll-wrap">
              <div class="whumies-order-details-heading-bar">
                <h3 class="whumies-order-details-heading">Order Details</h3>
              </div>

              <div class="whumies-order-scroll-area" id="whumiesOrderScrollArea">
                <div class="whumies-order-details-block">
                  <div class="whumies-detail-row">
                        <span class="whumies-detail-label">Order ID:</span>
                        <span class="whumies-detail-value">${escapeHTML(order.orderNumber || "-")}</span>
                      </div>

                      <div class="whumies-detail-row">
                        <span class="whumies-detail-label">Customer Email:</span>
                        <span class="whumies-detail-value">${escapeHTML(order.customerEmail || "-")}</span>
                      </div>

                      <div class="whumies-detail-row">
                        <span class="whumies-detail-label">Customer Phone:</span>
                        <span class="whumies-detail-value">${escapeHTML(order.customerPhone || "-")}</span>
                      </div>

                      <div class="whumies-detail-row whumies-detail-row-address">
                        <span class="whumies-detail-label">Customer Address:</span>
                        <span class="whumies-detail-value">${formatAddress(order.customerAddress)}</span>
                      </div>

                      <div class="whumies-detail-row">
                        <span class="whumies-detail-label">Payment Method:</span>
                        <span class="whumies-detail-value">${escapeHTML(order.paymentMethod || "-")}</span>
                      </div>

                      <div class="whumies-detail-row">
                        <span class="whumies-detail-label">Total Amount:</span>
                        <span class="whumies-detail-value">${formatMoney(order.totalAmount)}</span>
                      </div>

                      <div class="whumies-detail-row">
                        <span class="whumies-detail-label">Fulfillment Status:</span>
                        <span class="whumies-detail-value">${escapeHTML(order.fulfillmentStatus || "-")}</span>
                      </div>

                      <div class="whumies-detail-row">
                        <span class="whumies-detail-label">Financial Status:</span>
                        <span class="whumies-detail-value">${escapeHTML(order.financialStatus || "-")}</span>
                      </div>
                </div>

                <div class="whumies-order-products-section">
                  <h4 class="whumies-order-section-title">Ordered Products</h4>
                  ${productsHTML}
                </div>
              </div>

              <div class="whumies-scroll-indicator" id="whumiesScrollIndicator" aria-hidden="true">
                <span class="whumies-scroll-indicator-text">Scroll to view more</span>
                <span class="whumies-scroll-indicator-arrow">↓</span>
              </div>
            </div>

            <div class="whumies-order-tracking-section">
              <h4 class="whumies-order-section-title">Tracking Details</h4>
              <p class="whumies-tracking-helper">
                Please track your order directly using the link below:
              </p>
              ${trackingHTML}
            </div>
          </div>
        </div>
      `;
    }

    modeButtons.forEach((btn) => {
      btn.addEventListener("click", function (e) {
        e.preventDefault();
        e.stopPropagation();
        if (isSubmitting) return;
        clearErrors();
        setMode(btn.dataset.mode);
      });
    });

    orderInput.addEventListener("input", function () {
      let cleanValue = sanitizeText(orderInput.value);
      cleanValue = cleanValue.replace(/^wh/i, "");
      cleanValue = digitsOnly(cleanValue);
      cleanValue = cleanValue.slice(0, ORDER_MAX_LENGTH);
      orderInput.value = cleanValue;
      orderInput.classList.remove("whumies-input-error");
    });

    orderInput.addEventListener("paste", function (e) {
      e.preventDefault();
      const pastedData = (e.clipboardData || window.clipboardData).getData(
        "text",
      );
      let safeData = sanitizeText(pastedData).toLowerCase();
      safeData = safeData.replace(/^#?wh/i, "");
      safeData = digitsOnly(safeData).slice(0, ORDER_MAX_LENGTH);
      orderInput.value = safeData;
    });

    mobileInput.addEventListener("input", function () {
      let cleanValue = sanitizeText(mobileInput.value);
      cleanValue = digitsOnly(cleanValue);
      cleanValue = cleanValue.slice(0, MOBILE_MAX_LENGTH);
      mobileInput.value = cleanValue;
      mobileInput.classList.remove("whumies-input-error");
    });

    mobileInput.addEventListener("paste", function (e) {
      e.preventDefault();
      const pastedData = (e.clipboardData || window.clipboardData).getData(
        "text",
      );
      const safeData = digitsOnly(sanitizeText(pastedData)).slice(
        0,
        MOBILE_MAX_LENGTH,
      );
      mobileInput.value = safeData;
    });

    emailInput.addEventListener("input", function () {
      emailInput.value = sanitizeText(emailInput.value).toLowerCase();
      emailInput.classList.remove("whumies-input-error");
    });

    searchAgainBtn.addEventListener("click", function () {
      flipToForm();
      orderInput.focus();
    });

    form.addEventListener("submit", async function (e) {
      e.preventDefault();
      if (isSubmitting) return;

      clearErrors();

      let rawOrder = sanitizeText(orderInput.value).toLowerCase();
      rawOrder = rawOrder.replace(/^wh/i, "");
      rawOrder = digitsOnly(rawOrder);

      if (!rawOrder) {
        showError("Please enter your order number.", "order");
        return;
      }

      if (
        rawOrder.length < ORDER_MIN_LENGTH ||
        rawOrder.length > ORDER_MAX_LENGTH
      ) {
        showError("Order number is invalid.", "order");
        return;
      }

      const fullOrderNumber = "wh" + rawOrder;
      const payload = { orderNumber: fullOrderNumber };

      if (activeMode === "mobile") {
        let rawMobile = sanitizeText(mobileInput.value);
        rawMobile = digitsOnly(rawMobile);

        if (!rawMobile) {
          showError("Please enter your mobile number.", "mobile");
          return;
        }

        if (
          rawMobile.length < MOBILE_MIN_LENGTH ||
          rawMobile.length > MOBILE_MAX_LENGTH
        ) {
          showError("Please enter a valid mobile number.", "mobile");
          return;
        }

        if (/^0+$/.test(rawMobile)) {
          showError("Mobile number cannot contain only zeros.", "mobile");
          return;
        }

        payload.mobileNumber = rawMobile;
      } else {
        const rawEmail = sanitizeText(emailInput.value).toLowerCase();

        if (!rawEmail) {
          showError("Please enter your email address.", "email");
          return;
        }

        if (!isValidEmail(rawEmail)) {
          showError("Please enter a valid email address.", "email");
          return;
        }

        payload.email = rawEmail;
      }

      setLoadingState(true);

      try {
        const response = await fetch(
          "https://whumies-order-tracker-production.up.railway.app/api/track-order",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(payload),
          },
        );

        const data = await response.json();

        if (!response.ok || !data.success) {
          showError(data.message || "No matching order found.");
          return;
        }

        renderOrderDetails(data.order);
        setupScrollIndicator();
        flipToDetails();
      } catch (error) {
        showError("Something went wrong. Please try again.");
      } finally {
        setLoadingState(false);
      }
    });

    setMode("mobile");
  });
</script>
